services:
  - type: web
    name: cardioecho-ai
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ECHOAI_SEED_DEMO_DATA
        value: 'true'
      - key: DB_PATH
        value: /var/data/echo.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: ALLOWED_ORIGINS
        value: https://echo-j3gd.onrender.com,http://localhost:3000,http://127.0.0.1:3000
      - key: ECHOAI_ENV
        value: production
      - key: ECHOAI_USERS_PATH
        value: /var/data/users.json
      - key: ECHOAI_SESSIONS_PATH
        value: /var/data/sessions.db
      - key: ECHOAI_SECURE_COOKIE
        value: 'true'
      - key: ECHOAI_PASSWORD
        sync: false
    disk:
      name: echo-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: echo-j3gd
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://echo-backend-yx5t.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
